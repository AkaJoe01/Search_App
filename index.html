<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search App</title>
</head>
<body>
    <main>
        <h1 class="offscreen">Search Me a wikipedia power engine</h1>
        <section class="searchEntry">
            <h2 class="offscreen">Search Term Entry</h2>
            <div class="logo" aria-hidden="true">
                logo
            </div>
            <form action="" id="searchBar" class="searchBar">
                <label for="searchInput" class="offscreen">Search Term</label>
                <input type="text" autocomplete="off" id="searchInput" name="searchInput" placeholder="Enter your search term...">
                <div id="clear" class="none buttn clear" role="button"
                tabindex="0" aria-label="Clear search term">X
            </div>
            <button id="searchButton" class="button searchButton" type="submit" aria-label="submit Button">
                Search
            </button>
            </form>
        </section>
        <section class="results">
            <h2 class="offscreen">Search Results</h2>
            <div class="statsBar">
                <div id="stats" class="stats" aria-live="assertive">
                    <   !-- <p>Search results will appear here</p> -->
                </div>
            </div>
            <div id="searchResults" class="searchResults">

            </div>
        </section>
    </main>
    <footer>
        <p><span aria-hidden="true">&lt;&lt;</span> Powered by <a href="https://www.wikipedia.org" target="_blank" rel="noopener noreferrer">Wikipedia</a> <span aria-hidden="true">&gt;&gt;</span></p>
    </footer>
</body>
</html>
